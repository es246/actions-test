name: Python Gitflow CI/CD

on:
  # Triggers for running tests on code changes
  push:
    branches: [ main, develop, 'release/*', 'hotfix/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # JOB 1: Test & Quality Control (Runs on EVERY branch/PR)
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Match your project's version

      # Install uv automatically using the official GitHub Action
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true # Handles fast workflow caching across runs

      # Run linting instantly using uvx (no manual installs needed)
      - name: Lint Code with Flake8
        run: |
          uvx flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          uvx flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Run tests using uv run (automatically reads your pyproject.toml)
      - name: Run Tests with Pytest
        run: |
          uv run pytest

  # JOB 2: Deploy to Development / Staging Environment
  deploy-staging:
    needs: test-and-lint
    # Runs only if tests pass AND code is pushed to develop or a release branch
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Deploy to Staging
        run: |
          echo "Deploying Python application to the STAGING environment..."
          # Replace this line with your actual staging deployment commands 
          # Example: uv run fab deploy_staging or your custom script

  # JOB 3: Deploy to Production Environment
  deploy-production:
    needs: test-and-lint
    # Runs only if tests pass AND code is safely merged/pushed into main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Deploy to Production
        run: |
          echo "Deploying Python application to the PRODUCTION environment..."
          # Replace this line with your actual production deployment commands
          # Example: uv run fab deploy_production or your cloud CLI tool
